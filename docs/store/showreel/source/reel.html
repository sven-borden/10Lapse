<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>10Lapse showreel</title>
<style>
:root{--disp:'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;--txt:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif}
html,body{margin:0;background:#0C0C0D;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0C0C0D;color:#F4F2EE;font-family:var(--txt);font-size:14px;line-height:20px}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none}
canvas{display:block}
.sb{height:32px;padding:0 10px;border-radius:4px;display:inline-flex;align-items:center;gap:8px;color:var(--text);white-space:nowrap;box-sizing:border-box}
.ib{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;color:var(--text)}
.acc{height:32px;padding:0 14px;border-radius:4px;border:1px solid var(--accentStroke);background:var(--accent);color:var(--onAccent);font-weight:600;display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;white-space:nowrap}
.std{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--stroke);background:var(--ctrl);color:var(--text);display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;white-space:nowrap}
.sec{padding:16px 0;border-bottom:1px solid var(--divider);display:flex;flex-direction:column;gap:12px}
.h2{font-size:14px;line-height:20px;font-weight:600}
.cap{font-size:12px;line-height:16px;color:var(--text2)}
.tab{font-variant-numeric:tabular-nums}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:12px;line-height:16px;color:var(--text2)}
.sel{height:32px;border-radius:4px;border:1px solid var(--stroke);background:var(--ctrl);color:var(--text);display:flex;align-items:center;justify-content:space-between;padding:0 10px;box-sizing:border-box;font-size:14px;line-height:20px}
.mw{display:inline-block;overflow:hidden;vertical-align:top;padding:0.06em 0.04em 0.2em;margin:-0.06em -0.04em -0.2em}
.mi{display:inline-block}
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
const W = 1920, H = 1080;
const stage = document.getElementById('stage');
const INK = '#F4F2EE', INK2 = '#C3BFB8', AMBER_D = '#F0A54A';

// ---------------------------------------------------------------- helpers
function el(tag, css, parent, html) {
  const e = document.createElement(tag);
  if (css) e.style.cssText = css;
  if (html != null) e.innerHTML = html;
  (parent || stage).appendChild(e);
  return e;
}
function sv(tag, attrs, parent) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function mk(w, h, css, parent) { const c = el('canvas', css || '', parent); c.width = w; c.height = h; return c; }
function refs(root) { const r = {}; root.querySelectorAll('[data-r]').forEach(n => { r[n.dataset.r] = n; }); return r; }
function scene(z) { const s = el('div', z ? `z-index:${z}` : '', stage); s.className = 'scene'; return s; }

const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
function bez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = u => ((ax * u + bx) * u + cx) * u, sy = u => ((ay * u + by) * u + cy) * u;
  const dx = u => (3 * ax * u + 2 * bx) * u + cx;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let u = x;
    for (let i = 0; i < 8; i++) {
      const e = sx(u) - x;
      if (Math.abs(e) < 1e-7) return sy(u);
      const d = dx(u);
      if (Math.abs(d) < 1e-6) break;
      u -= e / d;
    }
    let lo = 0, hi = 1;
    u = x;
    for (let i = 0; i < 40; i++) { if (sx(u) < x) lo = u; else hi = u; u = (lo + hi) / 2; }
    return sy(u);
  };
}
const E = {
  enter: bez(0.16, 1, 0.3, 1),
  exit: bez(0.7, 0, 0.84, 0),
  move: bez(0.65, 0, 0.35, 1),
  punch: bez(0.55, 0, 0.1, 1),
  pull: bez(0.42, 0, 0.12, 1),
  lin: u => u,
  sine: u => -(Math.cos(Math.PI * u) - 1) / 2,
  expoOut: u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u),
  expoIn: u => u <= 0 ? 0 : Math.pow(2, 10 * u - 10),
  expoInOut: u => u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2,
};
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hx(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
const C = c => typeof c === 'string' ? hx(c) : c;
function mixc(a, b, u) { a = C(a); b = C(b); return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u]; }
function rgba(c, al = 1) { c = C(c); return `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${al})`; }
function rampc(stops, t) {
  t = clamp(t);
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i][0], b = stops[i + 1][0];
    if (t <= b) return mixc(stops[i][1], stops[i + 1][1], (t - a) / (b - a));
  }
  return C(stops[stops.length - 1][1]);
}
const pad4 = n => String(n).padStart(4, '0');
function clock(i) {
  const s = 19 * 3600 + 5 * i;
  return `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
function fmtTc(sec) { const m = Math.floor(sec / 60), s = sec - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0'); }

// Masked per-character and per-word reveals.
function maskChars(parent, text, css) {
  const out = [];
  for (const ch of text) {
    if (ch === ' ') { parent.appendChild(document.createTextNode(' ')); continue; }
    const o = el('span', '', parent); o.className = 'mw';
    const i = el('span', css || '', o, ch); i.className = 'mi';
    out.push(i);
  }
  return out;
}
function maskWords(parent, text) {
  const out = [];
  text.split(' ').forEach((wd, k, arr) => {
    const o = el('span', '', parent); o.className = 'mw';
    const i = el('span', '', o, wd); i.className = 'mi';
    out.push(i);
    if (k < arr.length - 1) parent.appendChild(document.createTextNode(' '));
  });
  return out;
}
function rise(nodes, t, t0, stagger, dur, outT, outDur) {
  nodes.forEach((n, k) => {
    const u = E.enter(prog(t, t0 + k * stagger, t0 + k * stagger + dur));
    const o = outT == null ? 0 : E.exit(prog(t, outT + k * stagger * 0.4, outT + k * stagger * 0.4 + (outDur || 0.28)));
    n.style.transform = `translateY(${(1 - u) * 132 - o * 132}%)`;
    n.style.opacity = clamp(u * 3) * (1 - o);
  });
}

// ---------------------------------------------------------------- the harbor sunset (the app's sample sequence look)
const TOP = [[0, '#5E9BD6'], [0.35, '#86A6D1'], [0.5, '#8C83B5'], [0.62, '#584C8C'], [0.75, '#2B3268'], [0.88, '#141B3F'], [1, '#070B1C']];
const HOR = [[0, '#C4E0F3'], [0.33, '#F6CF86'], [0.48, '#F29A55'], [0.6, '#D9677A'], [0.73, '#6D5A9E'], [0.86, '#2E3A72'], [1, '#10162E']];
function skyAt(T) {
  const top = rampc(TOP, T), hor = rampc(HOR, T);
  const land = mixc('#33405A', '#090D18', clamp(T * 1.25));
  const sunO = clamp(1 - (T - 0.4) / 0.13);
  return {
    top, hor, mid: mixc(top, hor, 0.55), land,
    waterTop: mixc(hor, land, 0.45), waterBot: mixc(land, '#05070D', 0.5),
    sun: mixc('#FFF6DC', '#FF9C58', clamp(T * 1.9)), glow: mixc('#FFE6A8', '#FF7A45', clamp(T * 1.9)),
    sunY: 0.22 + T, sunO, stars: clamp((T - 0.66) / 0.22),
  };
}
const SKYLINE = [0, 70, 4, 70, 4, 45, 7, 45, 7, 62, 11, 62, 11, 30, 13, 30, 13, 22, 14, 22, 14, 30, 16, 30, 16, 58, 22, 58, 22, 48, 27, 48, 27, 66, 33, 66, 33, 38, 36, 38, 36, 52, 41, 52, 41, 72, 47, 72, 47, 55, 52, 55, 52, 26, 54, 26, 54, 10, 55, 10, 55, 26, 57, 26, 57, 50, 63, 50, 63, 68, 70, 68, 70, 40, 74, 40, 74, 60, 80, 60, 80, 34, 83, 34, 83, 56, 89, 56, 89, 74, 94, 74, 94, 52, 100, 52, 100, 100, 0, 100];
const BAND_TOP = 0.66, BAND_H = 0.17, HORIZON = 0.83;
const LIGHTS = (() => {
  const r = rng(7), out = [];
  for (let i = 0; i < SKYLINE.length - 2; i += 2) {
    const x0 = SKYLINE[i], y0 = SKYLINE[i + 1], x1 = SKYLINE[i + 2], y1 = SKYLINE[i + 3];
    if (y0 !== y1 || x1 <= x0 || y0 >= 100) continue;
    const top = BAND_TOP + BAND_H * y0 / 100 + 0.007;
    const cols = Math.max(1, Math.floor((x1 - x0) / 0.62));
    const pad = ((x1 - x0) - cols * 0.62) / 2 + 0.19;
    for (let c = 0; c < cols; c++) for (let y = top; y < HORIZON - 0.009; y += 0.0105) {
      if (r() < 0.4) continue;
      out.push({ x: (x0 + pad + c * 0.62) / 100, y, on: 0.42 + r() * 0.36, warm: r() < 0.7 ? 0 : 1, f: r() });
    }
  }
  return out;
})();
const SHORE = (() => { const r = rng(9), a = []; for (let i = 0; i < 34; i++) a.push({ x: (i + 0.5) / 34 + (r() - 0.5) * 0.012, on: 0.45 + r() * 0.12, l: 0.06 + r() * 0.07 }); return a; })();
const STARS = (() => { const r = rng(3), a = []; for (let i = 0; i < 230; i++) a.push({ x: r(), y: r() * 0.6, s: 0.5 + r() * r() * 1.7, tw: r() * 6.283, b: 0.45 + r() * 0.55 }); return a; })();
const CLOUDS = (() => {
  const r = rng(11), a = [];
  for (let i = 0; i < 9; i++) {
    const blobs = [], n = 4 + (r() * 4 | 0);
    for (let j = 0; j < n; j++) blobs.push({ dx: (r() - 0.5) * 0.2, dy: (r() - 0.5) * 0.022, rx: 0.045 + r() * 0.075, ry: 0.011 + r() * 0.018 });
    a.push({ x: r() * 1.5 - 0.45, y: 0.07 + r() * 0.36, sp: 0.18 + r() * 0.3, blobs, a: 0.32 + r() * 0.3 });
  }
  return a;
})();
const SHIMMER = (() => { const r = rng(13), a = []; for (let i = 0; i < 46; i++) a.push({ x: r(), y: Math.pow(r(), 1.4), w: 0.015 + r() * 0.09, a: 0.05 + r() * 0.08, sp: (r() - 0.5) * 0.4 }); return a; })();

function blob(ctx, x, y, rx, ry, col, al) {
  if (al <= 0.003) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, rgba(col, al));
  g.addColorStop(0.55, rgba(col, al * 0.55));
  g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, rx, 0, 6.2832); ctx.fill();
  ctx.restore();
}

function drawHarbor(ctx, w, h, T, o = {}) {
  const k = skyAt(T), small = !!o.small, time = o.time || 0;
  const hz = h * HORIZON;
  ctx.save();
  let g = ctx.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, rgba(k.top)); g.addColorStop(0.46 / HORIZON, rgba(k.mid)); g.addColorStop(0.68 / HORIZON, rgba(k.hor));
  g.addColorStop(1, rgba(mixc(k.hor, k.glow, 0.18 * k.sunO)));
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, hz + 1);
  if (k.stars > 0) {
    const sc = w / 1920;
    for (const s of STARS) {
      if (small && s.s < 1.1) continue;
      const tw = 0.72 + 0.28 * Math.sin(s.tw + time * 2.6);
      ctx.fillStyle = `rgba(255,251,239,${(k.stars * s.b * tw).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(s.x * w, s.y * h, Math.max(0.55, s.s * sc), 0, 6.2832); ctx.fill();
    }
  }
  const sx = 0.63 * w, sy = k.sunY * h;
  if (k.sunO > 0) {
    let hg = ctx.createRadialGradient(sx, sy, 0, sx, sy, w * 0.45);
    hg.addColorStop(0, rgba(k.glow, 0.32 * k.sunO)); hg.addColorStop(0.3, rgba(k.glow, 0.12 * k.sunO)); hg.addColorStop(1, rgba(k.glow, 0));
    ctx.fillStyle = hg; ctx.fillRect(0, 0, w, hz);
    const R = 0.0495 * w;
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, R);
    const sa = Math.min(1, k.sunO * 1.35);
    sg.addColorStop(0, rgba(mixc(k.sun, '#FFFFFF', 0.5), sa)); sg.addColorStop(0.36, rgba(k.sun, sa)); sg.addColorStop(0.58, rgba(k.glow, sa * 0.8));
    sg.addColorStop(0.72, rgba(k.glow, 0)); sg.addColorStop(1, rgba(k.glow, 0));
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, R, 0, 6.2832); ctx.fill();
  }
  const cBase = mixc(mixc(k.hor, '#FFFFFF', 0.42 * (1 - T)), k.top, 0.16 + 0.62 * clamp((T - 0.45) / 0.4));
  const under = 0.55 * Math.exp(-Math.pow((T - 0.42) / 0.15, 2));
  for (const c of CLOUDS) {
    const cx0 = (c.x + c.sp * T * 0.9) * w, cy0 = c.y * h;
    for (const b of c.blobs) {
      blob(ctx, cx0 + b.dx * w, cy0 + b.dy * h, b.rx * w, b.ry * h, cBase, c.a * (1 - 0.5 * T));
      if (under > 0.01) blob(ctx, cx0 + b.dx * w, cy0 + b.dy * h + b.ry * h * 0.5, b.rx * w * 0.85, b.ry * h * 0.55, k.glow, under * c.a);
    }
  }
  const hgA = 0.4 * Math.exp(-Math.pow((T - 0.45) / 0.2, 2));
  if (hgA > 0.005) {
    g = ctx.createLinearGradient(0, h * (HORIZON - 0.24), 0, hz);
    g.addColorStop(0, rgba(k.glow, 0)); g.addColorStop(1, rgba(k.glow, hgA));
    ctx.fillStyle = g; ctx.fillRect(0, h * (HORIZON - 0.24), w, h * 0.24);
  }
  ctx.fillStyle = rgba(k.land);
  ctx.beginPath();
  for (let i = 0; i < SKYLINE.length; i += 2) {
    const x = SKYLINE[i] / 100 * w, y = (BAND_TOP + BAND_H * SKYLINE[i + 1] / 100) * h;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fill();
  const lw = Math.max(1, 0.0024 * w), lh = Math.max(1, 0.0048 * h);
  if (T > 0.41) {
    for (const L of LIGHTS) {
      const a = clamp((T - L.on) / 0.05);
      if (a <= 0) continue;
      ctx.fillStyle = L.warm ? `rgba(255,227,163,${a.toFixed(3)})` : `rgba(255,210,122,${a.toFixed(3)})`;
      ctx.fillRect(L.x * w, L.y * h, lw, lh);
    }
    for (const S of SHORE) {
      const a = clamp((T - S.on) / 0.06);
      if (a <= 0) continue;
      const x = S.x * w, y = hz - 0.004 * h;
      blob(ctx, x, y, 0.007 * w, 0.007 * w, '#FFD9A0', 0.35 * a);
      ctx.fillStyle = `rgba(255,236,200,${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(x, y, Math.max(0.6, 0.0013 * w), 0, 6.2832); ctx.fill();
    }
  }
  g = ctx.createLinearGradient(0, hz, 0, h);
  g.addColorStop(0, rgba(k.waterTop)); g.addColorStop(1, rgba(k.waterBot));
  ctx.fillStyle = g; ctx.fillRect(0, hz, w, h - hz + 1);
  ctx.fillStyle = rgba(mixc(k.hor, '#FFFFFF', 0.25), 0.35);
  ctx.fillRect(0, hz, w, Math.max(1, h * 0.0016));
  if (!small) {
    const sc = mixc(k.hor, '#FFFFFF', 0.25);
    for (const s of SHIMMER) {
      const y = hz + s.y * (h - hz);
      const x = (((s.x + T * s.sp) % 1.2 + 1.2) % 1.2 - 0.1) * w;
      ctx.fillStyle = rgba(sc, s.a * (1 - s.y * 0.6));
      ctx.fillRect(x, y, s.w * w, Math.max(1, h * 0.0013));
    }
  }
  if (k.sunO > 0) {
    const n = small ? 8 : 22;
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n;
      const y = hz + u * (h - hz);
      const ww = (0.008 + 0.034 * u) * w * (0.55 + 0.45 * Math.sin(i * 12.9898 + T * 40));
      ctx.fillStyle = rgba(k.glow, k.sunO * 0.55 * (1 - 0.6 * u));
      ctx.fillRect(0.632 * w - ww / 2, y, ww, Math.max(1, 0.0034 * h));
    }
  }
  if (T > 0.43) {
    for (const S of SHORE) {
      const a = clamp((T - S.on) / 0.06);
      if (a <= 0) continue;
      const x = S.x * w;
      const sg = ctx.createLinearGradient(0, hz, 0, hz + S.l * h);
      sg.addColorStop(0, `rgba(255,205,140,${(0.4 * a).toFixed(3)})`); sg.addColorStop(1, 'rgba(255,205,140,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(x - 0.0011 * w, hz, 0.0022 * w, S.l * h);
    }
    if (!small) {
      for (const L of LIGHTS) {
        if (L.y < HORIZON - 0.06) continue;
        const a = clamp((T - L.on) / 0.05);
        if (a <= 0) continue;
        const ry = HORIZON + (HORIZON - L.y) * 1.15 + 0.003;
        ctx.fillStyle = `rgba(255,214,140,${(0.2 * a).toFixed(3)})`;
        ctx.fillRect(L.x * w + Math.sin(L.f * 40 + T * 30) * 1.5 * w / 1920, ry * h, lw, lh * 2.4);
      }
    }
  }
  ctx.restore();
  if (o.blur) {
    ctx.save();
    ctx.filter = `blur(${o.blur}px) brightness(1.18)`;
    ctx.drawImage(ctx.canvas, 0, 0);
    ctx.restore();
  }
}

// 742 thumbnails: one photo every 5 seconds from 19:00:00.
const N = 742;
const THUMBS = [];
for (let i = 0; i < N; i++) {
  const c = document.createElement('canvas'); c.width = 180; c.height = 120;
  drawHarbor(c.getContext('2d'), 180, 120, i / (N - 1), { small: true });
  THUMBS.push(c);
}
function thumbInto(cv, i, opt) {
  const x = cv.getContext('2d');
  if (opt && opt.blur) { drawHarbor(x, cv.width, cv.height, i / (N - 1), { small: true, blur: opt.blur }); return; }
  x.drawImage(THUMBS[i], 0, 0, cv.width, cv.height);
}

// ---------------------------------------------------------------- background
const bg = el('div', 'position:absolute;inset:0;background:radial-gradient(ellipse 72% 62% at 50% 46%,#1A1816 0%,#0E0D0C 56%,#080809 100%)');
const spill = el('div', 'position:absolute;left:210px;top:20px;width:1500px;height:1040px;opacity:0');

// ================================================================ S1  the shoot  [0, 2)
const S1 = (() => {
  const root = scene();
  const glow = el('div', 'position:absolute;left:310px;top:110px;width:1300px;height:860px', root);
  const grp = el('div', 'position:absolute;inset:0;transform-origin:960px 540px', root);
  const gate = el('div', 'position:absolute;left:780px;top:420px;width:360px;height:240px;border-radius:3px;overflow:hidden;background:#141413', grp);
  const cv = mk(720, 480, 'width:360px;height:240px', gate);
  const cx = cv.getContext('2d');
  const flash = el('div', 'position:absolute;inset:0;background:#FFF8EC;opacity:0', gate);
  const svg = sv('svg', { width: 1920, height: 1080, style: 'position:absolute;left:0;top:0' }, grp);
  const R = sv('rect', { x: 772, y: 412, width: 376, height: 256, rx: 8, fill: 'none', stroke: AMBER_D, 'stroke-width': 2 }, svg);
  const per = 2 * (376 + 256) - 8 * 8 + 2 * Math.PI * 8;
  R.setAttribute('stroke-dasharray', `${per} ${per}`);
  const capL = el('div', 'position:absolute;left:772px;top:686px;font-size:20px;line-height:28px;color:#C3BFB8;font-variant-numeric:tabular-nums', grp);
  const capR = el('div', 'position:absolute;left:772px;width:376px;top:686px;font-size:20px;line-height:28px;color:#C3BFB8;font-variant-numeric:tabular-nums;text-align:right', grp);
  const CL = [0.75, 1.0, 1.125, 1.25, 1.3125, 1.375, 1.4375, 1.5];
  const CI = [0, 4, 12, 26, 46, 72, 104, 142];

function odometer(parent, digits, lh) {

  };
}

      fill.style.transform = `scaleX(${P})`;
      pct.textContent = `${Math.round(P * 100)}%`;
      fr.textContent = t >= 23.76 ? 'Finishing the file…' : `Frame ${pad4(Math.max(1, Math.round(P * N)))} of 0742`;
      const tu = E.enter(prog(t, 20.95, 21.35));
      title.style.opacity = tu; title.style.transform = `translateY(${(1 - tu) * 12}px)`;
      specs.forEach((s, k) => {
        const u = E.enter(prog(t, SPEC_T[k], SPEC_T[k] + 0.4));
        const newest = t < (SPEC_T[k + 1] || 99);
        s.style.opacity = u;
        s.style.color = newest ? '#F4F2EE' : '#C3BFB8';
        s.style.transform = `translateY(${(1 - u) * 18}px)`;
      });
      const endPunch = E.enter(prog(t, 23.74, 24.0));
      grp.style.transform = `scale(${1 + 0.02 * endPunch})`;
    },
  };
})();

// ================================================================ S7  night, private  [26, 28)  and the time slice
const ICONC = ['#8EC0EA', '#F3C46B', '#EE8F4F', '#B4567A', '#2B3A75'];
const S7 = (() => {
  const root = scene();
  const wrap = el('div', 'position:absolute;inset:0;transform-origin:960px 540px', root);
  const cv = mk(1920, 1080, '', wrap);
  const cx = cv.getContext('2d');
  const vign = el('div', 'position:absolute;inset:0;background:radial-gradient(ellipse 52% 40% at 50% 47%,rgba(4,6,14,0.55) 0%,rgba(4,6,14,0) 72%)', root);
  const txt = el('div', 'position:absolute;left:0;top:0;width:1920px;height:1080px', root);
  const lsv = sv('svg', { width: 104, height: 104, viewBox: '0 0 16 16', style: 'position:absolute;left:908px;top:282px;overflow:visible', fill: 'none', stroke: '#F4F2EE', 'stroke-width': 0.85, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, txt);
  const lb = sv('rect', { x: 3.5, y: 7, width: 9, height: 7, rx: 1.5 }, lsv);
  const ls = sv('path', { d: 'M5.5 7V5a2.5 2.5 0 0 1 5 0v2' }, lsv);
  const lbl = 2 * (9 + 7) - 6 * 0.43 + 2, lsl = 4 + Math.PI * 2.5 + 0.5;
  lb.setAttribute('stroke-dasharray', `${lbl} ${lbl}`); ls.setAttribute('stroke-dasharray', `${lsl} ${lsl}`);
  const head = el('div', 'position:absolute;left:0;width:1920px;top:408px;text-align:center;font-family:var(--disp);font-weight:600;font-size:92px;line-height:104px;letter-spacing:-0.02em;color:#F4F2EE', txt);
  const words = maskWords(head, 'Your photos never leave this PC.');
  const det = el('div', 'position:absolute;left:0;width:1920px;top:540px;text-align:center;font-size:30px;line-height:40px;color:#D5D1CA', txt, 'No account. No analytics. No network access.');
  // slices: the night frame flips to a time slice of the whole evening
  const NS = 40, SW = 48;
  const slices = [];
  const night = document.createElement('canvas'); night.width = 1920; night.height = 1080;
  drawHarbor(night.getContext('2d'), 1920, 1080, 1, { time: 27.2 });
  const tmp = document.createElement('canvas'); tmp.width = 1920; tmp.height = 1080;
  const tx = tmp.getContext('2d');
  const sliceRoot = el('div', 'position:absolute;inset:0;display:none', root);
  for (let i = 0; i < NS; i++) {
    const d = el('div', `position:absolute;left:${i * SW}px;top:0;width:${SW}px;height:1080px;transform-origin:${SW / 2}px 540px`, sliceRoot);
    const f = mk(SW, 1080, 'position:absolute;inset:0', d);
    f.getContext('2d').drawImage(night, i * SW, 0, SW, 1080, 0, 0, SW, 1080);
    const b = mk(SW, 1080, 'position:absolute;inset:0;display:none', d);
    drawHarbor(tx, 1920, 1080, 0.02 + 0.96 * i / (NS - 1), { time: 27.2 });
    b.getContext('2d').drawImage(tmp, i * SW, 0, SW, 1080, 0, 0, SW, 1080);
    const tint = el('div', `position:absolute;inset:0;background:${ICONC[Math.floor(i / 8)]};opacity:0`, d);
    const shade = el('div', 'position:absolute;inset:0;background:#000;opacity:0', d);
    slices.push({ d, f, b, tint, shade });
  }
  return {
    t0: 26.0, t1: 28.0, root,
    update(t) {
      const sl = t >= 27.2;
      sliceRoot.style.display = sl ? 'block' : 'none';
      wrap.style.display = sl ? 'none' : 'block';
      if (!sl) {
        drawHarbor(cx, 1920, 1080, 1, { time: t });
        wrap.style.transform = `scale(${lerp(1.0125, 1, E.sine(prog(t, 26.0, 27.2)))})`;
      }
      const lu = E.enter(prog(t, 26.12, 26.62));
      lb.setAttribute('stroke-dashoffset', lbl * (1 - lu));
      ls.setAttribute('stroke-dashoffset', lsl * (1 - E.enter(prog(t, 26.3, 26.75))));
      const out = E.exit(prog(t, 26.98, 27.2));
      lsv.style.opacity = 1 - out;
      lsv.style.transform = `translateY(${-out * 20}px)`;
      rise(words, t, 26.22, 0.05, 0.6, 26.96, 0.24);
      const du = E.enter(prog(t, 26.55, 27.0));
      det.style.opacity = du * (1 - out); det.style.transform = `translateY(${(1 - du) * 14 - out * 20}px)`;
      vign.style.opacity = 1 - E.lin(prog(t, 26.98, 27.25));
      if (sl) {
        slices.forEach((s, i) => {
          const th = 180 * E.move(prog(t, 27.2 + i * 0.009, 27.2 + i * 0.009 + 0.3));
          const front = th <= 90;
          s.f.style.display = front ? 'block' : 'none';
          s.b.style.display = front ? 'none' : 'block';
          s.d.style.transform = `perspective(1400px) rotateY(${front ? th : th - 180}deg)`;
          s.shade.style.opacity = 0.62 * Math.sin(th * Math.PI / 180);
          s.tint.style.opacity = E.move(prog(t, 27.72 + (i % 8) * 0.006, 27.985));
        });
      }
    },
  };
})();

// ================================================================ S8  five frames  [28, 30]
const S8 = (() => {
  const root = scene();
  const lock = el('div', 'position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 520px', root);
  const tile = el('div', 'position:absolute;overflow:hidden', lock);
  const bands = ICONC.map(c => el('div', `position:absolute;top:0;height:100%;background:${c}`, tile));
  const sheen = el('div', 'position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0) 50%);opacity:0', tile);
  const sweep = el('div', 'position:absolute;top:-40%;height:180%;width:46%;left:0;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0.38) 50%,rgba(255,255,255,0) 100%);opacity:0', tile);
  const word = el('div', 'position:absolute;left:0;top:0;font-family:var(--disp);font-weight:600;font-size:156px;line-height:156px;letter-spacing:-0.02em;color:#F4F2EE;white-space:nowrap', lock, '10Lapse');
  const tag = el('div', 'position:absolute;left:0;width:1920px;text-align:center;font-size:34px;line-height:44px;color:#D5D1CA', lock, 'Turn a folder of photos into a timelapse video.');
  const store = el('div', 'position:absolute;left:0;width:1920px;text-align:center;font-size:23px;line-height:30px;color:#C3BFB8;white-space:pre', lock, 'Windows 11    ·    Microsoft Store');
  const fade = el('div', 'position:absolute;inset:0;background:#000;opacity:0', root);
  const TS = 208, GAP = 46;
  let TX = 0, TY = 336;
  function layout() {
    const prev = root.style.display;
    root.style.display = 'block';
    const ww = word.getBoundingClientRect().width;
    root.style.display = prev;
    TX = Math.round((1920 - (TS + GAP + ww)) / 2);
    word.style.left = (TX + TS + GAP) + 'px';
    word.style.top = (TY + TS / 2 - 86) + 'px';
    tag.style.top = (TY + TS + 64) + 'px';
    store.style.top = (TY + TS + 128) + 'px';
  }
  return {
    t0: 28.0, t1: 30.01, root, layout,
    update(t) {
      const e = E.expoOut(prog(t, 28.07, 28.8));
      const x = lerp(0, TX, e), y = lerp(0, TY, e), w = lerp(1920, TS, e), h = lerp(1080, TS, e);
      tile.style.left = x + 'px'; tile.style.top = y + 'px'; tile.style.width = w + 'px'; tile.style.height = h + 'px';
      tile.style.borderRadius = lerp(0, TS * 10 / 40, e) + 'px';
      bands.forEach((b, k) => { b.style.left = (k * 8.15 / 40 * w) + 'px'; b.style.width = (7.4 / 40 * w) + 'px'; });
      sheen.style.opacity = E.enter(prog(t, 28.35, 28.85));
      const su = E.move(prog(t, 28.55, 29.15));
      sweep.style.opacity = su > 0 && su < 1 ? 1 : 0;
      sweep.style.transform = `translateX(${lerp(-120, 260, su)}%) rotate(18deg)`;
      const wu = E.enter(prog(t, 28.42, 29.02));
      word.style.clipPath = `inset(-20px ${(1 - wu) * 100}% -40px 0)`;
      word.style.transform = `translateX(${(1 - wu) * -46}px)`;
      const tu = E.enter(prog(t, 28.78, 29.25));
      tag.style.opacity = tu; tag.style.transform = `translateY(${(1 - tu) * 14}px)`;
      const su2 = E.enter(prog(t, 29.02, 29.45));
      store.style.opacity = su2; store.style.transform = `translateY(${(1 - su2) * 12}px)`;
      lock.style.transform = `scale(${1 + 0.025 * E.sine(prog(t, 28.7, 30.0))})`;
      fade.style.opacity = E.lin(prog(t, 29.72, 30.0)) * 0.92;
    },
  };
})();

// ================================================================ timeline
const SCENES = [S1, S2, S3, UI, F3, E2, S7, S8];
F3.root.style.zIndex = 4; E2.root.style.zIndex = 5; S7.root.style.zIndex = 5; S8.root.style.zIndex = 5;
let laidOut = false;
window.renderAt = function (t) {
  if (!laidOut) { S8.layout(); laidOut = true; }
  spill.style.opacity = 0;
  UI.root.style.zIndex = t >= 17.0 && t < 18.5 ? 6 : 2;
  for (const s of SCENES) {
    const on = t >= s.t0 && t < s.t1;
    s.root.style.display = on ? 'block' : 'none';
    if (on) s.update(t);
  }
};
window.CUTS = [2.0, 8.0, 21.0, 24.0];
const HEAVY = [[1.5, 1.95, 6], [2.0, 2.75, 12], [4.5, 5.5, 10], [5.5, 5.95, 6], [6.0, 6.7, 12], [7.95, 8.75, 12], [8.3, 9.2, 8], [9.0, 9.8, 6], [10.0, 12.1, 8],
  [13.88, 14.2, 12], [14.2, 15.95, 5], [15.88, 16.3, 12], [16.2, 17.35, 6], [17.78, 18.2, 12], [18.45, 18.85, 6], [18.95, 19.35, 6], [19.88, 20.2, 12], [20.45, 20.65, 6], [20.6, 21.05, 12],
  [21.0, 23.8, 16], [23.7, 24.0, 6], [25.45, 26.05, 12], [27.15, 28.0, 10], [28.0, 28.8, 12], [28.5, 29.2, 6]];
window.samplesAt = function (t) {
  let n = 3;
  for (const [a, b, k] of HEAVY) if (t >= a && t < b) n = Math.max(n, k);
  return n;
};
window.ready = document.fonts.ready.then(() => { S8.layout(); laidOut = true; return true; });
</script>
</body>
